image: node:20
variables:
  INLINE_DOCKER_REGISTRY: $CI_REGISTRY_IMAGE
  DOCKER_HOST: tcp://docker:2376
  INLINE_PIPELINE_IMAGE_TAG: "$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA" # we need to add the commit sha because the docker policy currently does not download images if already in cache with the same tag

  KUBERNETES_CPU_REQUEST: "0.45"
  KUBERNETES_MEMORY_REQUEST: "1Gi"
  KUBERNETES_MEMORY_LIMIT: "4Gi"
  YARN_CACHE_FOLDER: $CI_PROJECT_DIR/.yarn/cache
stages:
  - test
  - build
  - deploy
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      variables:
        SHOULD_MINIFY: "1"
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\).*/ # not after semantic release commits
      when: never
    - if: $CI_COMMIT_BRANCH =~ /^[0-9]+\.([0-9]+|x)\.x$/ # hotfix branches
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_MERGE_REQUEST_ID

.yarn-cache:
  cache:
    - key: yarn
      policy: pull-push
      paths:
        - .yarn/cache
        - node_modules
        - "**/node_modules/"

test:
  stage: "test"
  extends:
    - .yarn-cache
  script:
    - yarn install --immutable
    - yarn test

🔨 packages:
  stage: "build"
  needs: [] # don't wait for test atm
  extends:
    - .yarn-cache
  script:
    - yarn install --immutable
    - yarn build
  artifacts:
    paths:
      - "*/dist"

.docker-build-base:
  image: docker:24
  needs: []
  interruptible: true
  retry: 2 # ugly hack for https://gitlab.com/gitlab-org/gitlab-runner/-/issues/27384
  services:
    - docker:24.0.6-dind # https://github.com/docker-library/docker/issues/463

  stage: build
  variables:
    DOCKER_BUILDKIT: "1"
    DOCKER_DRIVER: overlay2
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_TLS_VERIFY: 1
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
    IMAGE_NAME: $CI_REGISTRY_IMAGE/$NAME
    CACHE_IMAGE: $CI_REGISTRY_IMAGE/$NAME/cache:cache
    BUILD_CONTEXT: ./runner-images/$NAME
    DOCKER_FILE: ./runner-images/$NAME/Dockerfile
  script:
    - docker login --username gitlab-ci-token --password $CI_JOB_TOKEN $CI_REGISTRY
    - docker build --network host --cache-from $CACHE_IMAGE --tag $IMAGE_NAME:$INLINE_PIPELINE_IMAGE_TAG -f $DOCKER_FILE $BUILD_CONTEXT --build-arg BUILDKIT_INLINE_CACHE=1
    - docker push $IMAGE_NAME:$INLINE_PIPELINE_IMAGE_TAG
    - docker tag $IMAGE_NAME:$INLINE_PIPELINE_IMAGE_TAG $CACHE_IMAGE
    - docker push $CACHE_IMAGE
    # when is a release (has tag), also push as latest
    - if [ -n "$CI_COMMIT_TAG" ]; then
      docker tag $IMAGE_NAME:$INLINE_PIPELINE_IMAGE_TAG $IMAGE_NAME:latest;
      docker push $IMAGE_NAME:latest;
      fi

🔨 runner base-pipeline:
  needs: ["🔨 packages"]
  variables:
    NAME: "base-pipeline"
    BUILD_CONTEXT: .
  extends:
    - .docker-build-base

🔨 runner kubernetes:
  variables:
    NAME: kubernetes
  extends:
    - .docker-build-base

.docker-build-jobs-base:
  variables:
    BUILD_CONTEXT: ./runner-images
  extends:
    - .docker-build-base

🔨 runner jobs-default:
  variables:
    NAME: jobs-default
  extends:
    - .docker-build-jobs-base

🔨 runner jobs-meteor:
  variables:
    NAME: jobs-meteor
  extends:
    - .docker-build-jobs-base

🔨 runner jobs-testing-chrome:
  variables:
    NAME: jobs-testing-chrome
  extends:
    - .docker-build-jobs-base

🔨 runner docker-in-docker:
  variables:
    NAME: docker-build
  extends:
    - .docker-build-base
🔨 runner semantic-release:
  needs: ["🔨 packages"]
  variables:
    NAME: semantic-release
    BUILD_CONTEXT: .
  extends:
    - .docker-build-base
🔨 runner gcloud:
  variables:
    NAME: gcloud
  extends:
    - .docker-build-base

🚀 includes:
  stage: deploy
  script:
    - set +e # Disable exit on error, otherwise gitlab will stop if variables below are not set
    - 'echo "version: $CI_COMMIT_REF_SLUG"'
      # if its a tagged version, e.g. v1.2.3, publish all v1, v1.2 and v1.2.3
      # if not, just deploy the one version
      # CI_COMMIT_REF_SLUG contains either the tag or the current branch name
      # first publish the exact version or branch version (canary)
    - VERSION_TO_DEPLOY=$CI_COMMIT_REF_SLUG
    - &deploy '[ "$VERSION_TO_DEPLOY" ] && echo "deploying $VERSION_TO_DEPLOY" && curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file ci-includes/dist/includes/gitlab-ci.yml "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/ci-includes/$VERSION_TO_DEPLOY/gitlab-ci.yml"'
      # then if is tagged version, split and deploy major and minor
      # we do this so that you can include just "v1" and get all minor updates
    - MAJOR_VERSION=$([ "$CI_COMMIT_TAG" ] && echo $CI_COMMIT_TAG | cut -f1 -d.)
    - MINOR_VERSION=$([ "$CI_COMMIT_TAG" ] && echo $CI_COMMIT_TAG | cut -f1,2 -d.)
    - VERSION_TO_DEPLOY=$MAJOR_VERSION
    - *deploy
    - VERSION_TO_DEPLOY=$MINOR_VERSION
    - *deploy
    - set -e # reenable

.npm-publish-base:
  image: node:14 # npm publish has some problem with node 16
  extends:
    - .yarn-cache
  needs: ["🔨 packages"]
  stage: deploy
  retry: 1 # https://github.com/npm/feedback/discussions/796
  script:
    - VERSION=$([ "$CI_COMMIT_TAG" ] && echo "${CI_COMMIT_TAG#'v'}" || echo "0.0.0-$INLINE_PIPELINE_IMAGE_TAG")
    - echo "publish version $VERSION"
    - yarn workspaces foreach version $VERSION --deferred
    - yarn version apply -R --all
    - cd $DIR
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > .npmrc
    - DIST_TAG=$([ "$CI_COMMIT_TAG" ] && echo "latest" || echo "canary")
    - npm publish --tag $DIST_TAG --no-git-tag-version --access public

🚀 cli:
  extends: .npm-publish-base
  variables:
    DIR: cli

🚀 pipeline:
  extends: .npm-publish-base
  variables:
    DIR: pipeline

create release:
  stage: release
  image: $INLINE_DOCKER_REGISTRY/semantic-release:$INLINE_PIPELINE_IMAGE_TAG
  script:
    - semanticRelease
  rules:
    - if: $CI_PIPELINE_SOURCE == "parent_pipeline" # do not allow creating releases in a monorepo. this will handled in the parent pipeline insead
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /^chore\(release\).*/ # not after semantic release commit
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_BRANCH =~ /^[0-9]+\.([0-9]+|x)\.x$/ # hotfix branches
      when: manual

pages:
  stage: deploy
  extends: [.yarn-cache]
  allow_failure: true
  interruptible: true
  script:
    - echo "Pages accessible through ${CI_PAGES_URL}/${PAGES_PREFIX}"
    - yarn install
    - yarn workspace docs gen-examples-md
    - yarn workspace docs build
  variables:
    PAGES_PREFIX: "" # No prefix by default (master)
  pages:
    path_prefix: "$PAGES_PREFIX"
  artifacts:
    paths: [public]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH # Run on default branch (with default PAGES_PREFIX)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" # Conditionally change the prefix for Merge Requests
      when: manual # Run pages manually on Merge Requests
      variables:
        PAGES_PREFIX: "mr-$CI_MERGE_REQUEST_IID" # Prefix with the mr-<iid>, like `mr-123`
