image: node:22
stages:
  - setup
  - test
  - build
  - deploy
  - verify
  - agents
  - rollback
  - stop
  - release
variables:
  FF_USE_FASTZIP: 'true'
  ARTIFACT_COMPRESSION_LEVEL: fast
  CACHE_COMPRESSION_LEVEL: fast
  TRANSFER_METER_FREQUENCY: 5s
  GIT_DEPTH: '1'
workflow:
  name: $PIPELINE_ICON $PIPELINE_NAME
  rules:
    - if: $CI_PIPELINE_SOURCE  == "trigger"
      variables:
        PIPELINE_ICON: 🤖
        PIPELINE_NAME: Thinking...
    - if: $CI_MERGE_REQUEST_ID
      variables:
        PIPELINE_ICON: 🐱🔨
        PIPELINE_NAME: mr$CI_MERGE_REQUEST_IID - $CI_MERGE_REQUEST_TITLE
    - if: $CI_COMMIT_TAG
      variables:
        PIPELINE_ICON: 🐱📦
        PIPELINE_NAME: Release $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && ($CI_COMMIT_MESSAGE !~ /^chore\(release\).*/ || $CI_PIPELINE_SOURCE != "push")
      variables:
        PIPELINE_ICON: 🐱🔨
        PIPELINE_NAME: Main - $CI_COMMIT_TITLE
    - when: always
      variables:
        PIPELINE_ICON: 🐱❓
        PIPELINE_NAME: Default
before_script:
  - |-
    function escapeForDotEnv () {
    input="${1:-$(cat)}"
     input="${input//$'\n'/\\n}"
      if [[ "$input" == *\\n* ]]; then
        if [[ "$input" == *\"* && "$input" == *\'* && "$input" == *\`* ]]; then
          printf "\"%s\"\n" "$input" 
        elif [[ "$input" == *\"* && "$input" == *\'* ]]; then
          printf "`%s`\n" "$input"
        elif [[ "$input" == *\"* ]]; then
          printf "'%s'\n" "$input"
        else
          printf "\"%s\"\n" "$input"
        fi
      else
        printf "%s\n" "$input"
      fi
    }
  - |-
    function collapseable_section_start () {
    local section_title="${1}"
      local section_description="${2:-$section_title}"
      echo -e "section_start:`date +%s`:${section_title}[collapsed=true]\r\e[0K${section_description}"
    }
  - |-
    function collapseable_section_end () {
    local section_title="${1}"
      echo -e "section_end:`date +%s`:${section_title}\r\e[0K"
    }
