{{- if .Values.legacyprisma1.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:

  name: {{ template "fullname" . }}-prisma
  labels:
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ template "fullname" . }}-prisma
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "fullname" . }}-prisma
        release: {{ .Release.Name }}
        
    spec:
      containers:
      - name: prisma
        image: 'prismagraphql/prisma:1.34'
        {{include "env" . | nindent 8}}
        ports:
          - name: prisma-4466
            containerPort: 4466
          
{{- end -}}
