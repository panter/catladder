{{- if .Values.prisma.enabled -}}
apiVersion: apps/v1
kind: Deployment
metadata:

  name: {{ template "fullname" . }}-prisma
  labels:
    app: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
  
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ template "fullname" . }}-prisma
      release: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ template "fullname" . }}-prisma
        release: {{ .Release.Name }}
        
    spec:
      containers:
        - name: prisma
          image: 'prismagraphql/prisma:1.34'
          ports:
            - name: prisma-4466
              containerPort: 4466
          env:
            - name: PRISMA_CONFIG
              valueFrom:
                configMapKeyRef:
                  name: {{ template "fullname" . }}-prisma-configmap
                  key: PRISMA_CONFIG
{{- end -}}
