{{- if .Values.ingress.enabled -}}
{{- if .Values.application -}}
{{- $servicePort := .Values.service.externalPort -}}
{{- $app := .Values.application -}}
{{ $hosts := without (prepend (default (list nil) $app.hostAliases) (include "host" .)) nil }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ template "fullname" . }}-app
  labels:
    app: {{ template "name" . }}
    chart: {{ .Chart.Name }}-{{ .Chart.Version | replace "+" "_" }}
    release: {{ .Release.Name }}
    heritage: {{ .Release.Service }}
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$1  
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "x-build-id: {{ .Values.global.BUILD_ID }}";
    {{- if and .Values.gitlab.visualReviewEnabled (and  .Values.global.ENV_SHORT (eq .Values.global.ENV_SHORT "review"))}}
      proxy_set_header Accept-Encoding ""; 
      sub_filter_once on;
      sub_filter "</head>" "{{- include "visualReviewSnippet" . | nindent 8 -}}</head>";
    {{- end }}
  {{- range $key, $value := .Values.ingress.annotations }}
    {{ $key }}: {{ $value | quote }}
  {{- end }}
spec:
  rules:
  {{- range $hosts }}
    - host: {{ . }}
      http:
        paths:
          - path: /?(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: {{ template "fullname" $ }}-app
                port:
                  number: {{ $servicePort }}
  {{- end }}
  tls:
    - secretName: {{ include "host" . | trunc 59 }}-tls
      hosts:
      {{- range $hosts }}
        - {{ . }}
      {{- end }}
{{- end -}}
{{- end -}}
