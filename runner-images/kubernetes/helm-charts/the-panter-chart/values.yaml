# Default values for manulstack helm chart.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

global:
  componentName: web
  ENV_SHORT: dev
  BUILD_ID:
image:
  repository:
  name:
  pullPolicy: Always
  pullSecret: gitlab-registry

service:
  type: ClusterIP
  externalPort: 80
  internalPort: 8080
  additionalPorts: []

env:
  public:
    NODE_ENV: production
    TZ: Europe/Zurich
  secret: {}

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: nginx
    kubernetes.io/tls-acme: "true"
    nginx.ingress.kubernetes.io/affinity: cookie
    nginx.ingress.kubernetes.io/affinity-mode: persistent
    nginx.ingress.kubernetes.io/session-cookie-hash: sha1
    nginx.ingress.kubernetes.io/session-cookie-name: route
    nginx.ingress.kubernetes.io/session-cookie-path: /
  tls: []

jobDefaults:
  resources:
    limits:
      cpu: 1000m
    requests:
      cpu: 50m
      memory: 350Mi

application:
  enabled: true
  replicas: 1
  hostCanonical:
  command:
  # these requests are usually overridden by the gitlab include and values
  resources:
    limits:
      cpu: 1000m
      memory: 600Mi
    requests:
      cpu: 50m
      memory: 150Mi
  updateStrategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate

  worker:
    enabled: false
    useExclusivePool: false
    service:
      enabled: false
      type: ClusterIP
      externalPort: 80
      internalPort: 8080
      additionalPorts: []
    livenessProbe: true
    resources:
      limits:
        cpu: 1000m
        memory: 1000Mi
      requests:
        cpu: 50m
        memory: 350Mi
  startupProbe:
    httpGet:
      path: /__health
      port: 8080
      httpHeaders:
        - name: X-PAN-HEALTHCHECK
          value: startup
    failureThreshold: 60
    timeoutSeconds: 3
    periodSeconds: 5
  livenessProbe:
    httpGet:
      path: /__health
      port: 8080
      httpHeaders:
        - name: X-PAN-HEALTHCHECK
          value: liveness
    periodSeconds: 5
    timeoutSeconds: 10
  readinessProbe:
    httpGet:
      path: /__health
      port: 8080
      httpHeaders:
        - name: X-PAN-HEALTHCHECK
          value: readiness
    failureThreshold: 3
    timeoutSeconds: 3
    periodSeconds: 5
    successThreshold: 1

gitlab:
  visualReviewEnabled: false
  app:
  env:
  projectPath:
  mergeRequestId:
  projectId:

## features

mongodb:
  enabled: false
  dbName: app
  backup:
    enabled: false
  # see https://github.com/bitnami/charts/issues/10264#issuecomment-1181574288
  livenessProbe:
    enabled: false
  customLivenessProbe:
    exec:
      command:
        - sh
        - -c
        - mongo --port $MONGODB_PORT_NUMBER --eval "db.adminCommand('ping')"
  readinessProbe:
    enabled: false
  customReadinessProbe:
    exec:
      command:
        - sh
        - -c
        - mongo --port $MONGODB_PORT_NUMBER --eval 'db.isMaster().ismaster || db.isMaster().secondary' | grep -q 'true'

secretsFromOtherComponent: {}
mapServiceUrlToEnv: {}
cloudsql:
  enabled: false

mailhog:
  enabled: false
  useOauth: true
