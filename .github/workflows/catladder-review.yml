          function escapeForDotEnv () {
          input="${1:-$(cat)}"
           input="${input//$'\n'/\\n}"
            if [[ "$input" == *\\n* ]]; then
              if [[ "$input" == *\"* && "$input" == *\'* && "$input" == *\`* ]]; then
                printf "\"%s\"\n" "$input" 
              elif [[ "$input" == *\"* && "$input" == *\'* ]]; then
                printf "`%s`\n" "$input"
              elif [[ "$input" == *\"* ]]; then
                printf "'%s'\n" "$input"
              else
                printf "\"%s\"\n" "$input"
              fi
            else
              printf "%s\n" "$input"
            fi
          }
          function collapseable_section_start () {
